services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

  health-catalog:
    build: ../services/health-catalog
    container_name: health-catalog
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
        ]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

  data-storage:
    build:
      context: ../services/data-storage
      dockerfile: Dockerfile
    container_name: data-storage
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - DB_PATH=/app/data/health.db
      - HEALTH_CATALOG_URL=http://health-catalog:8000
    ports:
      - "8003:8003"
    volumes:
      - ../data:/app/data
    depends_on:
      health-catalog:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"
        ]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

  dashboard-backend:
    build: ../services/dashboard-backend
    container_name: dashboard-backend
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    depends_on:
      health-catalog:
        condition: service_healthy
      data-storage:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy

  risk_analysis:
    build: ../services/risk_analysis
    container_name: risk-analysis
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - HEALTH_CATALOG_URL=http://health-catalog:8000
    depends_on:
      health-catalog:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
      data-storage:
        condition: service_healthy

  alert_notification:
    build: ../services/alert_notification
    container_name: alert-notification
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - HEALTH_CATALOG_URL=http://health-catalog:8000
    depends_on:
      health-catalog:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
      data-storage:
        condition: service_healthy

  wristband-simulator:
    build: ../services/wristband-simulator
    container_name: wristband-simulator
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - DATA_STORAGE_URL=http://data-storage:8003
    depends_on:
      mqtt-broker:
        condition: service_healthy
      data-storage:
        condition: service_healthy
