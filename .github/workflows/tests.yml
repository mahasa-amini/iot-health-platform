name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/health-catalog/requirements.txt
          pip install -r services/data-storage/requirements.txt
          pip install -r services/dashboard-backend/requirements.txt
          pip install -r services/risk_analysis/requirements.txt
          pip install -r services/alert_notification/requirements.txt
          pip install -r services/wristband-simulator/requirements.txt
          pip install pytest httpx

      - name: Run regression suite
        run: pytest -q
